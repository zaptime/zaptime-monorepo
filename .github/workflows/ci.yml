name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Run Core tests
        run: pnpm --filter @zaptime/core test
