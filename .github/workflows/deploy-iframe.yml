name: Deploy iframe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "packages/core/**"
      - "packages/vue3/**"
      - "packages/vue-headless/**"
      - "packages/browser/**"
      - "shared/calendar-ui/**"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "packages/iframe/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-iframe.yml"

permissions:
  contents: read

concurrency:
  group: deploy-iframe
  cancel-in-progress: true

jobs:
  verification:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: Build and deploy to Cloudflare Pages
    needs: verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Require reviewed backend recovery evidence
        env:
          RECOVERY_VERIFIED: ${{ vars.CALENDAR_RECOVERY_VERIFIED }}
        run: |
          if [ "$RECOVERY_VERIFIED" != "true" ]; then
            echo "Deployment blocked: complete the calendar recovery contract and release validation, then set CALENDAR_RECOVERY_VERIFIED=true."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Vue calendar dependencies
        run: pnpm --filter @zaptime/vue3... run build
        env:
          VITE_STRIPE_CLIENT_KEY: ${{ secrets.VITE_STRIPE_CLIENT_KEY }}

      - name: Test iframe
        run: pnpm --filter iframe test

      - name: Build iframe
        run: pnpm --filter iframe build

      - name: Deploy to Cloudflare Pages
        run: pnpm --filter iframe run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
